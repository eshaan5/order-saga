# docker compose up -d      start
# docker compose down       stop, keep data
# docker compose down -v    stop, wipe data (re-runs db/*.sql on next up)

services:
  mysql:
    image: mysql:8.4          # 8.0 is EOL; SKIP LOCKED needs 8.0+
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro   # runs once, on first boot only

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
