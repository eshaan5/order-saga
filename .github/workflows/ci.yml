# Continuous Integration.
#
# Every push builds and tests the project on a FRESH Ubuntu machine that has
# never seen this code. That is the whole value: it proves a clean clone works,
# rather than proving it works on a laptop that already has node_modules,
# Docker running, and possibly an uncommitted file.

name: CI

# WHAT STARTS THIS RUN.
on:
  push:
    branches: [main]
  pull_request:
  # Lets you trigger a run by hand from the Actions tab — useful when you want
  # to re-run after changing something outside the repo.
  workflow_dispatch:

jobs:
  # Job name. It shows up in the GitHub UI and in the badge.
  build-and-unit-test:
    # The machine. A brand new VM, discarded when the job ends.
    runs-on: ubuntu-latest

    steps:
      # `uses:` runs a reusable action someone else published.
      # Without this the runner has an empty disk — it does not have your code.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read the version from .nvmrc instead of hardcoding it here, so the
          # two can never drift apart.
          node-version-file: '.nvmrc'
          # Caches ~/.npm keyed on package-lock.json. Turns a ~40s install into
          # a few seconds on runs where dependencies have not changed.
          cache: 'npm'

      # `npm ci`, NOT `npm install`.
      #   ci      — wipes node_modules and installs EXACTLY the lockfile. Fails
      #             if package.json and the lock disagree.
      #   install — may quietly update the lockfile to satisfy semver ranges.
      # In CI you want the second behaviour to be an error, not a silent fixup.
      - name: Install dependencies
        run: npm ci

      # Compiles every package in dependency order via project references.
      # This alone catches a whole class of "forgot to commit a file" bugs.
      - name: Build all packages
        run: npx tsc -b

      # Pure functions — no database, no network, no services needed.
      - name: Unit tests
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Angular component tests.
  #
  # A separate job because web/ lives OUTSIDE the npm workspace and has its own
  # dependency tree, so it needs its own install and its own cache key. Jobs run
  # in parallel, so this costs no extra wall-clock time.
  # ---------------------------------------------------------------------------
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # --watch=false explicitly: a watching test runner never exits, so the job
      # would hang until the 6-hour timeout instead of failing in 30 seconds.
      - name: Angular component tests
        run: npx ng test --watch=false
        working-directory: web

  # ---------------------------------------------------------------------------
  # Integration tests — the ones that prove the interesting behaviour.
  #
  # These need a real MySQL and the four services actually running, because
  # every bug worth catching here lives in the SQL or the HTTP behaviour. A
  # mocked version would pass while the system was broken.
  # ---------------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-latest

    # SERVICE CONTAINERS: GitHub starts these alongside the job and waits for
    # their health checks to pass before running a single step. Same idea as
    # docker-compose.yml, declared inline.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npx tsc -b

      # Installed explicitly rather than assumed — GitHub has trimmed
      # preinstalled packages from the runner image before.
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      # Service containers CANNOT mount /docker-entrypoint-initdb.d the way
      # Compose does, so the schema is applied by hand instead.
      - name: Apply schema
        run: |
          for f in db/00-schemas.sql db/01-saga.sql db/02-services.sql; do
            echo "applying $f"
            mysql -h 127.0.0.1 -uroot -proot < "$f"
          done

      - name: Seed inventory
        run: npm run seed

      - name: Start the four services
        run: |
          mkdir -p /tmp/logs
          for s in order inventory payment shipping; do
            nohup npx tsx "services/$s/src/index.ts" > "/tmp/logs/$s.log" 2>&1 &
          done
          # Poll health rather than sleeping a fixed amount. A fixed sleep is
          # either too short (flaky on a slow runner) or too long (wasted on
          # every single run, forever).
          for port in 3001 3002 3003 3004; do
            for i in $(seq 1 30); do
              curl -sf "localhost:$port/health" >/dev/null && break
              if [ "$i" = 30 ]; then
                echo "service on port $port never became healthy"
                tail -30 /tmp/logs/*.log
                exit 1
              fi
              sleep 1
            done
            echo "port $port healthy"
          done

      - name: Integration tests
        run: npm run test:integration

      # Without this a failure shows only the test assertion and none of the
      # service output that would explain it.
      - name: Dump service logs on failure
        if: failure()
        run: tail -50 /tmp/logs/*.log
